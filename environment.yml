name: dspop-us-birth-certificates
channels:
  - conda-forge
dependencies:
  # ── shared conda-forge compiled core (canonical) ──────────────────────────
  # Must match dse-research-utils' data/environment-core.yml exactly. Verify:
  #   dse-check-env environment.yml
  - python=3.14.6
  - numpy>=2.4.6,<2.5 # pymc>=6.1.0 -> pytensor 3.1.x -> numba<=0.65.1 -> numpy<2.5
  - scipy>=1.18.0
  - pandas>=3.0.3
  - pyarrow>=24.0.0 # pandas 3.x's default `str` dtype is Arrow-backed; floor held at 24 by jaxlib's libabseil pin
  - numba>=0.58,<=0.65.1 # pytensor 3.x caps numba; this is what pymc>=6.1.0 commits us to
  - matplotlib>=3.11.0
  - scikit-learn>=1.9.0
  - statsmodels>=0.14.6
  - pymc>=6.1.0 # pulls pytensor + a C toolchain from conda-forge; forces pytensor >=3.1.2 -> numba <=0.65.1 -> numpy <2.5
  - nutpie>=0.16.11
  - numpyro>=0.21.0
  - jax>=0.10.2 # CPU build; GPU acceleration via an environment-gpu.yml overlay
  - arviz>=1.2.0
  - arviz-base>=1.2.0
  - arviz-stats>=1.2.0
  - arviz-plots>=1.2.0
  - preliz>=0.27.0
  - h5py>=3.12.0
  - h5netcdf>=1.3.0
  - graphviz>=14.1.2
  - python-graphviz>=0.20
  # ── UBC add-ons (gradient boosting + columnar / statistical data) ─────────
  - lightgbm>=4.6.0
  - xgboost>=3.3.0
  - shap>=0.52.0
  - polars>=1.42.1
  - duckdb>=1.5.4
  - pyreadstat>=1.3.5
  - fastparquet
  - zarr
  - xarray>=2026.4.0
  - pip
  - pip:
      # Shared library from the public git tag (no auth; PyPI is a later
      # graduation). Its extras pull the pure-Python tail: notebook
      # (ipython/ipywidgets/notebook/jupytext), dependence (dcor), tuning
      # (optuna, optuna-integration), io (orjson/tabulate). This also pulls the
      # library's own runtime deps (azure-identity/-storage-blob, rich, psutil,
      # pyyaml, …) — no need to list them here.
      - dse-research-utils[notebook,dependence,tuning,io] @ git+https://github.com/dseinternational/research.git@v0.8.0#subdirectory=src/python
      - -e ./
      # Local-dev override — to develop against a sibling checkout of research
      # (note ../../ — this repo lives under dspopulations/, not dseinternational/),
      # comment the git line above and uncomment this instead:
      # - -e ../../dseinternational/research/src/python[notebook,dependence,tuning,io]
      # repo-only pure-Python tail
      - formulaic
      - mpmath
      - networkx
      - pingouin
      - plotly
      - pyxlsb
      - truststore
      # typing stubs + dev / build tooling
      - pandas-stubs
      - scipy-stubs
      - hatch
      - build
      - pytest>=9.1.1
      - ruff>=0.15.20
      - setuptools>=82.0.1
