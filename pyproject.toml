[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "dspopulations-us-birth-certificates"
dynamic = ["version"]
description = "Analysis of births of babies with Down syndrome recorded in US birth certificates."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Frank Buckley" }]

dependencies = [
  "numpy>=2.4.3",
  "pandas>=3.0.1",
  "duckdb>=1.5.2",
  "preliz>=0.18.0",
  "pymc>=5.28.4,<6.0",
  "nutpie>=0.16.8",
  "jaxlib>=0.9.2",
  "numpyro>=0.20.0",
  "arviz>=0.23.4,<1.0",
  "matplotlib>=3.10.8",
  "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
  "notebook>=7.5.5",
  "ipython>=9.11.0",
  "ipywidgets>=8.1.8",
  "pytest>=9.0.3",
  "ruff>=0.15.10",
]
modelling = [
  # Lower bounds track environment.yml (the canonical local env) and the
  # CI workflow. Bumping here requires updating both to avoid
  # "works locally, fails in CI" drift.
  "lightgbm>=4.6.0",
  "optuna>=4.8.0",
  "shap>=0.51.0",
  "scikit-learn>=1.8.0",
  "joblib>=1.4.0",
  "pyarrow>=23.0.1",
  "dcor>=0.6",
  "rich>=15.0.0",
]

[tool.hatch.version]
path = "src/dspopulations_us_birth_certificates/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dspopulations_us_birth_certificates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
  "slow: tests that fit a Bayesian model with enough draws to evaluate posterior quality (run explicitly with `pytest -m slow`)",
]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — long lines acceptable in scientific/modelling code
    "E741",  # ambiguous variable name — mathematical names (l, X, y) are meaningful
]

[tool.ruff.lint.per-file-ignores]
# DuckDB's Python API resolves DataFrame names from the enclosing scope when
# they appear in SQL (e.g. ``SELECT * FROM prevalence_df``). Ruff can't see
# those references and flags the assignments as F841 "local variable unused".
"scripts/duckdb_prepare.py" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["dspopulations_us_birth_certificates"]
