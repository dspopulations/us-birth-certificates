[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "dspopulations-us-birth-certificates"
dynamic = ["version"]
description = "Analysis of births of babies with Down syndrome recorded in US birth certificates."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Frank Buckley" }]

dependencies = [
  "arviz-plots>=1.2.0",
  "arviz-stats>=1.2.0",
  "arviz>=1.2.0",
  "duckdb>=1.5.5",
  "h5netcdf>=1.8.1",  # NetCDF backend arviz/xarray use to write idata.nc
  "h5py>=3.16.0",     # h5netcdf's HDF5 engine (not pulled automatically via pip)
  # jaxlib is conda-owned but only arrives transitively via jax; environment.yml
  # does not declare it. Keep this floor at or below what the conda layer may
  # solve to — conda's jax 0.10.2 admits jaxlib >=0.10.1,<=0.10.2 — or
  # `conda env update` makes pip try to take ownership of a conda package and
  # fails with "no RECORD file".
  "jaxlib>=0.10.1",
  "matplotlib>=3.11.1",
  "numpy>=2.4.6,<2.5",  # pymc -> pytensor -> numba pins numpy <2.5; matches the shared conda core
  "numpyro>=0.21.0",
  "nutpie>=0.16.11",
  "pandas>=3.0.5",
  "preliz>=0.27.1",
  "pymc>=6.2.0",
  "scipy>=1.18.0",
  "dse-research-utils>=0.9.0",
]

[project.optional-dependencies]
dev = [
  # Single pip-resolved development/CI extra. Keep aligned with environment.yml
  # rather than splitting test, modelling, and data-preparation dependencies
  # across multiple extras. Floors track the shared reconciled spec.
  "dcor>=0.6",
  "ipython>=9.11.0",
  "ipywidgets>=8.1.8",
  "joblib>=1.4.0",
  "lightgbm>=4.7.0",
  # numba is a transitive shap dep; pin it explicitly or the resolver backtracks
  # to numba 0.53.1 / llvmlite 0.36.0, which has no Python 3.14 wheel. Held at
  # 0.65.1 rather than the current 0.66.0 because pytensor 3.2.x caps it there.
  "numba>=0.65.1,<=0.66.0",
  "notebook>=7.5.5",
  "optuna>=4.9.0",
  "polars>=1.43.1",
  "pyarrow>=24.0.0",
  "pytest>=9.1.1",
  "rich>=15.0.0",
  "ruff>=0.16.1",
  "scikit-learn>=1.9.0",
  "shap>=0.52.0",
]

[tool.uv.sources]
# dse-research-utils isn't published to PyPI — resolve it from the public git
# tag. (The conda env in environment.yml installs it from the same tag in its
# pip layer; this entry is only consumed by uv.)
dse-research-utils = { git = "https://github.com/dseinternational/research.git", subdirectory = "src/python", tag = "v0.9.0" }

[tool.hatch.version]
path = "src/dspopulations_us_birth_certificates/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dspopulations_us_birth_certificates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
  "slow: tests that fit a Bayesian model with enough draws to evaluate posterior quality (run explicitly with `pytest -m slow`)",
]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — long lines acceptable in scientific/modelling code
    "E741",  # ambiguous variable name — mathematical names (l, X, y) are meaningful
]

[tool.ruff.lint.per-file-ignores]
# DuckDB's Python API resolves DataFrame names from the enclosing scope when
# they appear in SQL (e.g. ``SELECT * FROM prevalence_df``). Ruff can't see
# those references and flags the assignments as F841 "local variable unused".
"scripts/duckdb_prepare.py" = ["F841"]
# This script sets MKL/OpenMP/matplotlib env vars before importing numpy/
# matplotlib (the import-time MKL crash workaround), which necessarily places
# imports after module-level statements and splits the import block.
"scripts/analyse_descriptive.py" = ["E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["dspopulations_us_birth_certificates"]
