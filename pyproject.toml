[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "dspopulations-us-birth-certificates"
dynamic = ["version"]
description = "Analysis of births of babies with Down syndrome recorded in US birth certificates."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Frank Buckley" }]

# The scientific stack is inherited, not restated. `dse-research-utils` declares
# the canonical floors (numpy/scipy/pandas/pyarrow/numba/matplotlib/scikit-learn/
# statsmodels/pymc/pytensor/nutpie/arviz*/preliz/xarray) in its own metadata, so
# they cannot drift between DSE research repos. Extras compose the optional
# layers this repo actually uses:
#   boosting   lightgbm, shap, xgboost
#   columnar   duckdb, polars, pyreadstat
#   dependence dcor (stats_utils.distance_corr_matrix)
#   graphs     graphviz bindings, networkx — ALSO needs the system `dot` binary
#   io         orjson, tabulate
#   jax        jax, numpyro — `nuts_sampler` is read from run config, so the
#              NumPyro backend is selectable at runtime even though nothing
#              imports it directly
#   notebook   jupyter, jupytext
#   storage    h5py, h5netcdf, zarr (InferenceData on disk)
#   tuning     optuna, optuna-integration
dependencies = [
  "dse-research-utils[boosting,columnar,dependence,graphs,io,jax,notebook,storage,tuning]",
  "fastparquet",     # scripts/make_all.py writes parquet with engine="fastparquet"; no extra carries it
  "joblib>=1.4.0",   # imported at module top by tuning/training/models.lgbm_pipeline, so a runtime dep
  "truststore",      # scripts/download_data.py calls truststore.inject_into_ssl() at import
]

[dependency-groups]
# Development and CI tooling. PEP 735 groups are never written into published
# package metadata, so nothing here reaches anything installing this package.
# Everything the old `dev` extra carried that is now an extra on
# dse-research-utils (dcor, lightgbm, shap, optuna, polars, notebook) or one of
# its base dependencies (pyarrow, rich, scikit-learn) has been dropped from here;
# joblib moved up to [project.dependencies], since `src` imports it at run time.
dev = [
  "ipython>=9.11.0",
  "ipywidgets>=8.1.8",
  "pytest>=9.1.1",
  "ruff>=0.16.1",
]

[tool.uv]
# Platforms the lockfile is resolved for — the same set as the research repo, so
# a solve here matches a solve there. Intel macOS is deliberately absent: numba
# publishes no macosx x86_64 wheels and shap pins numba<0.63 there, so upstream
# has dropped it. Native win-amd64 is now covered; it could not be before,
# because conda-forge has no win-64 jaxlib.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
# dse-research-utils isn't published to PyPI — resolve it from the public git tag.
dse-research-utils = { git = "https://github.com/dseinternational/research.git", subdirectory = "src/python", tag = "v0.11.0" }
# Local-dev override — to develop against a sibling checkout of research (note
# the ../../ — this repo lives under dspopulations/, not dseinternational/),
# comment the git line above and uncomment this instead:
# dse-research-utils = { path = "../../dseinternational/research/src/python", editable = true }

[tool.hatch.version]
path = "src/dspopulations_us_birth_certificates/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dspopulations_us_birth_certificates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
  "slow: tests that fit a Bayesian model with enough draws to evaluate posterior quality (run explicitly with `pytest -m slow`)",
]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — long lines acceptable in scientific/modelling code
    "E741",  # ambiguous variable name — mathematical names (l, X, y) are meaningful
]

[tool.ruff.lint.per-file-ignores]
# DuckDB's Python API resolves DataFrame names from the enclosing scope when
# they appear in SQL (e.g. ``SELECT * FROM prevalence_df``). Ruff can't see
# those references and flags the assignments as F841 "local variable unused".
"scripts/duckdb_prepare.py" = ["F841"]
# This script sets MKL/OpenMP/matplotlib env vars before importing numpy/
# matplotlib (the import-time MKL crash workaround), which necessarily places
# imports after module-level statements and splits the import block.
"scripts/analyse_descriptive.py" = ["E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["dspopulations_us_birth_certificates"]
