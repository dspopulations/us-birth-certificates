name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Ruff check
        run: uv run --no-sync ruff check src scripts tests

  spellcheck:
    name: Spellcheck (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run spellcheck

  test:
    name: Tests (pytest)
    strategy:
      fail-fast: false
      matrix:
        # Native Windows is now covered. It was previously omitted because
        # jax/jaxlib have no conda-forge win-64 build, which forced Windows
        # contributors onto WSL; on PyPI jaxlib publishes cp314 win_amd64
        # wheels, so the whole stack installs natively.
        #
        # Intel macOS is absent because upstream has dropped it: numba ships no
        # macosx x86_64 wheels at all. See `tool.uv.environments` in
        # pyproject.toml.
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      # The PyPI lightgbm/xgboost wheels for macOS-arm64 link against LLVM's
      # OpenMP runtime and do not bundle it — conda-forge used to supply it via
      # llvm-openmp. Without this the `boosting` extra fails to import with
      # "Library not loaded: @rpath/libomp.dylib". Linux and Windows wheels
      # carry their own OpenMP runtime, so this is macOS-only.
      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --locked fails the build if uv.lock is stale rather than silently
      # resolving something different from what was reviewed. uv provisions the
      # interpreter itself from .python-version, so there is no setup-python step.
      - name: Install the locked environment
        run: uv sync --locked

      - name: Run pytest
        run: uv run --no-sync pytest
