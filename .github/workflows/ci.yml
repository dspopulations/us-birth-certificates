name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: astral-sh/setup-uv@v7
      - name: Install ruff
        run: uv tool install 'ruff>=0.15.18'
      - name: Ruff check
        run: ruff check src scripts tests

  spellcheck:
    name: Spellcheck (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 26.3.0
      - run: npm ci
      - run: npm run spellcheck

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: astral-sh/setup-uv@v7
      - name: Create venv
        run: uv venv --python 3.14
      - name: Install package (editable) with test + modelling deps
        # Single source of truth: install the package's real dependencies from
        # pyproject — [project.dependencies] (incl. the Bayesian stack) plus the
        # [dev] and [modelling] extras. No hand-maintained CI dep list to drift
        # out of sync (that drift is what previously let an ancient numba slip
        # in). dse-research-utils (not on PyPI) resolves from git via
        # [tool.uv.sources]. The Bayesian stack now installs in CI, so the
        # pymc-gated tests actually run rather than skip.
        run: uv pip install --python .venv -e '.[dev,modelling]'
      - name: Run pytest
        # --no-sync keeps the venv we just installed into. Without it, `uv run`
        # re-resolves against pyproject and can drop the editable install.
        run: uv run --no-sync --python .venv pytest
