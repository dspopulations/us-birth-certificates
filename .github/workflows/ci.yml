name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v7
      - name: Install ruff
        run: uv tool install 'ruff>=0.15.18'
      - name: Ruff check
        run: ruff check src scripts tests

  spellcheck:
    name: Spellcheck (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run spellcheck

  test:
    name: Tests (pytest)
    strategy:
      fail-fast: false
      matrix:
        # Native Windows is intentionally omitted: jax/jaxlib have no conda-forge
        # win-64 build, so the compiled stack cannot solve there. Windows users
        # work in Ubuntu on WSL (linux-64), which the ubuntu runner covers.
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup conda environment
        # Hybrid env: conda-forge compiled core + a pip layer that installs
        # dse-research-utils from the public git tag and the editable package.
        # This replaces the uv/pip-only install so the compiled scientific stack
        # comes from conda-forge and stays consistent across DSE research repos.
        uses: mamba-org/setup-micromamba@v3.1.0
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Verify environment core matches the canonical spec
        run: dse-check-env environment.yml

      - name: Run pytest
        run: pytest
