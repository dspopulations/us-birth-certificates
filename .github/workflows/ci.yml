name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install ruff
        run: uv tool install 'ruff>=0.15.10'
      - name: Ruff check
        run: ruff check src scripts tests

  spellcheck:
    name: Spellcheck (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm ci
      - run: npm run spellcheck

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Create venv
        run: uv venv --python 3.14
      - name: Install package (editable) with pinned runtime deps for tests
        # Installs the package editable with --no-deps, then pins the runtime
        # deps the test suite actually exercises. We intentionally skip the
        # heavy Bayesian stack (pymc/jaxlib/numpyro/arviz/nutpie/preliz)
        # declared in pyproject's main [project.dependencies] — those aren't
        # touched by tests and bloat install time. Drop --no-deps once the
        # Bayesian deps move into a separate extra.
        #
        # Bounds here track environment.yml (the canonical local env) so CI
        # and local runs resolve to the same major versions. Keep them in
        # sync when bumping either file.
        run: |
          uv pip install --python .venv --no-deps -e .
          uv pip install --python .venv \
            'numpy>=2.4.3' 'pandas>=3.0.1' 'scipy>=1.17.1' 'matplotlib>=3.10.8' \
            'duckdb>=1.5.2' 'dcor>=0.6' \
            'lightgbm>=4.6.0' 'optuna>=4.8.0' 'shap>=0.51.0' \
            'scikit-learn>=1.8.0' 'joblib>=1.4.0' 'pyarrow>=23.0.1' \
            'rich>=15.0.0' \
            'pytest>=9.0.3'
      - name: Run pytest
        # --no-sync keeps the venv we just pinned. Without it, `uv run`
        # re-resolves against pyproject.toml and drops the modelling pins
        # (joblib, lightgbm, etc.) the tests need.
        run: uv run --no-sync --python .venv pytest
