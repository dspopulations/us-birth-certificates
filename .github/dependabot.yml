version: 2

# Daily dependency scans, PRs assigned to the maintainer.
updates:
  # Python dependencies declared in pyproject.toml ([project.dependencies] and
  # [dependency-groups]), resolved through uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Europe/London"
    ignore:
      # Both ceilings below are inherited from dse-research-utils and pytensor,
      # not restated in this repo. They are deliberate constraints, not stale
      # pins: without these rules Dependabot proposes individually-plausible but
      # unsolvable widenings — as it did in
      # dseinternational/language-reading-predictors#467.
      #
      # numpy: pytensor 3.3.0 pins numba <=0.66.0 and numba 0.66.0 still pins
      # numpy <2.5, so 2.5 is unreachable for anything depending on pymc. Remove
      # once a pytensor release admits numba 0.67 (which allows numpy <2.6).
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
      # numba: belt and braces. pytensor now owns this ceiling upstream, so the
      # rule only stops Dependabot proposing a bump the solver would reject.
      - dependency-name: "numba"
        versions: [">0.66.0"]
    assignees:
      - "frankbuckley"

  # Spellcheck / tooling (package.json + package-lock.json).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Europe/London"
    assignees:
      - "frankbuckley"

  # GitHub Actions used in .github/workflows (checkout, setup-uv, setup-node).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Europe/London"
    assignees:
      - "frankbuckley"
